bio_short: >-
  Nhasala Joshi is an engineer turned development practitioner, and the
  co-founder and Executive Director of Women Leaders in Technology (WLiT), Nepal.
bio_long: >-
  Nhasala Joshi is an engineer turned development practitioner, and the
  co-founder and Executive Director of Women Leaders in Technology (WLiT), Nepal.
  Over more than a decade, she has led WLiT through 14 fellowship cohorts,
  supported more than 200 women tech professionals, and convened more than
  1,000 attendees at flagship community events. Her work spans community and
  ecosystem building, inclusion, digital rights, data, and civic tech, and
  internet governance.
