story:
  - Nhasala Joshi is an engineer turned development practitioner, and the co-founder and Executive Director of Women Leaders in Technology (WLiT), Nepal.
  - For over a decade she has led WLiT, which has run 14 fellowship cohorts, supported more than 200 women tech professionals, and convened more than 1,000 attendees at its flagship community events.
  - "Her work spans four areas: community and ecosystem building, inclusion, digital rights, data, and civic tech, and internet governance."
  - "[Placeholder: a closing paragraph on what drives her work and what she is focused on now. To be written with Nhasala.]"
