<footer class="site-footer on-ink">
  <div class="wrap">
    <div class="footer__top">
      <p class="footer__tagline">{{ site.tagline }}</p>
      <ul class="footer__links">
        <li>
          <a class="icon-link" href="mailto:{{ site.author.email }}" aria-label="Email {{ site.author.name }}" title="Email">
            <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          </a>
        </li>
        <li>
          <a class="icon-link" href="{{ site.author.linkedin }}" aria-label="{{ site.author.name }} on LinkedIn" title="LinkedIn" rel="me">
            <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11H3zM9.5 9.75h3.8v1.5h.06c.53-1 1.83-2.06 3.77-2.06 4.03 0 4.77 2.65 4.77 6.1v5.46h-4v-4.84c0-1.16-.02-2.64-1.61-2.64-1.61 0-1.86 1.26-1.86 2.56v4.92h-4z"/></svg>
          </a>
        </li>
      </ul>
    </div>
    <p class="footer__base">Except where otherwise noted, content on this site is licensed under <a href="{{ site.license.url }}" rel="license">{{ site.license.name }}</a>.</p>
  </div>
</footer>
