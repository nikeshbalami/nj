{%- assign nav = "About|/about/;Projects|/projects/;Writing and speaking|/writing/;Contact|/contact/" | split: ";" -%}
<header class="site-header on-ink">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <button class="hbtn nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="nav" id="site-nav" aria-label="Primary">
      <ul>
        {%- for item in nav -%}
          {%- assign parts = item | split: "|" %}
        <li><a href="{{ parts[1] | relative_url }}"{% if page.url == parts[1] %} aria-current="page"{% endif %}>{{ parts[0] }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
